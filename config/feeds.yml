# Knall-Feedliste v1
# Alle URLs werden beim ersten Lauf verifiziert. Google-News-Spiegelfeeds
# werden für Blätter ohne nativen RSS genutzt — fulltext.py löst deren Links
# zur Original-URL auf; geschrieben wird nur aus Originalartikeln.
# name: = Name des Mediums unter dem Artikel (Spiegel: kommt aus dem Feed).

definitions:
  # ---------- Linke Presse ----------
  taz_gesamt:
    type: nativ
    name: "taz"
    url: https://taz.de/!p4608;rss/
    ressort: all
  taz_wirtschaft:
    type: nativ
    name: "taz"
    url_pattern: "https://taz.de/Wirtschaft/!p{id};rss/"
    note: p-ID beim ersten Lauf verifizieren
    aktiv: false   # erst aktivieren, wenn url mit echter p-ID eingetragen ist
    ressort: kohle
  taz_gesellschaft:
    type: nativ
    name: "taz"
    url_pattern: "https://taz.de/Gesellschaft/!p{id};rss/"
    note: p-ID beim ersten Lauf verifizieren
    aktiv: false   # erst aktivieren, wenn url mit echter p-ID eingetragen ist
    ressort: alle-gleich
  taz_gesundheit:
    type: nativ
    name: "taz"
    url_pattern: "https://taz.de/Recht/!p{id};rss/"
    note: p-ID beim ersten Lauf verifizieren
    aktiv: false   # erst aktivieren, wenn url mit echter p-ID eingetragen ist
    ressort: pflege
  taz_oeko:
    type: nativ
    name: "taz"
    url_pattern: "https://taz.de/Umwelt/!p{id};rss/"
    note: p-ID beim ersten Lauf verifizieren
    aktiv: false   # erst aktivieren, wenn url mit echter p-ID eingetragen ist
    ressort: klima

  nd_gesamt:
    type: nativ
    name: "nd"
    url: https://nd-aktuell.de/rss/aktuell.php
    ressort: all

  # ---------- Überregionale ----------
  tagesschau:
    type: nativ
    name: "tagesschau.de"
    url: https://www.tagesschau.de/infoservices/alle-meldungen-100~rss2.xml
    ressort: all
  deutschlandfunk:
    type: nativ
    name: "Deutschlandfunk"
    url: https://www.deutschlandfunk.de/nachrichten-100.rss
    note: war eine HTML-Seite statt Feed; neue URL im naechsten Lauf-Log pruefen
    ressort: all

  # ---------- Behörden / Institutionen ----------
  destatis:
    type: nativ
    name: "Statistisches Bundesamt"
    # 2026-11-25: alte URL (SiteGlobal/RSS/Meldungen.rdf) lieferte HTTP 404
    url: https://www.destatis.de/SiteGlobal/Functions/RSSFeed/DE/RSSNewsfeed/RSSNewsfeed.xml
    ressort: woche
  verdi_pm:
    type: google-news-mirror
    query: "ver.di Pressemitteilung"
    ressort: kohle
  dgb_pm:
    type: google-news-mirror
    query: "DGB Pressemitteilung"
    ressort: kohle
  bundesagentur_arbeit:
    type: google-news-mirror
    query: "Bundesagentur für Arbeit Monatszahlen"
    ressort: kohle
  bmas:
    type: google-news-mirror
    query: "BMAS Pressemitteilung"
    ressort: kohle
  bmg:
    type: google-news-mirror
    query: "Bundesministerium Gesundheit Pressemitteilung"
    ressort: pflege
  umweltbundesamt:
    type: google-news-mirror
    query: "Umweltbundesamt Bericht"
    ressort: klima

  # ---------- Justiz / Verbraucher ----------
  gerichte:
    type: google-news-mirror
    query: "BGH Urteil Kündigung Miete"
    ressort: woche
  test_de:
    type: google-news-mirror
    query: "Stiftung Warentest Kostentest"
    ressort: woche

  # ---------- Ostdeutsche Lokalpresse (maximale Abdeckung) ----------
  # Nicht-Berlin: Brandenburg, MV, Sachsen, Sachsen-Anhalt, Thüringen.
  # Google-News-Spiegelfeeds pro Blatt, weil viele keinen nativen RSS bieten.
  moz:
    type: google-news-mirror
    query: "site:moz.de"
    region: brandenburg
    ressort: lokal
  lr_online:
    type: google-news-mirror
    query: "site:lr-online.de"
    region: brandenburg
    ressort: lokal
  lvz:
    aktiv: false   # 2026-11-25: blockt Abrufe (HTTP 403 bei 7 von 7 Artikeln), Volltext nicht erreichbar
    type: nativ
    name: "Leipziger Volkszeitung"
    url: https://www.lvz.de/arc/outboundfeeds/rss/
    region: sachsen
    ressort: lokal
  saechsische:
    type: google-news-mirror
    query: "site:saechsische.de"
    region: sachsen
    ressort: lokal
  freie_presse:
    type: google-news-mirror
    query: "site:freiepresse.de"
    region: sachsen
    ressort: lokal
  mz:
    type: google-news-mirror
    query: "site:mz-web.de"
    region: sachsen-anhalt
    ressort: lokal
  volksstimme:
    type: google-news-mirror
    query: "site:volksstimme.de"
    region: sachsen-anhalt
    ressort: lokal
  ostsee_zeitung:
    aktiv: false   # 2026-11-25: blockt Abrufe (HTTP 403 bei 7 von 7 Artikeln), Volltext nicht erreichbar
    type: google-news-mirror
    query: "site:ostsee-zeitung.de"
    region: mecklenburg-vorpommern
    ressort: lokal
  nordkurier:
    type: google-news-mirror
    query: "site:nordkurier.de"
    region: mecklenburg-vorpommern
    ressort: lokal
  thueringer_allgemeine:
    type: google-news-mirror
    query: "site:thueringer-allgemeine.de"
    region: thueringen
    ressort: lokal
  ossl:
    type: google-news-mirror
    query: "site:osradio.de"
    region: brandenburg
    ressort: lokal
  thueringer_post:
    aktiv: false   # 2026-11-25: Spiegel lieferte 0 Eintraege; Thueringen deckt jetzt mdr_thueringen ab
    type: google-news-mirror
    query: "site:tp-online.de"
    region: thueringen
    ressort: lokal

  # ---------- Öffentlich-rechtliche Regionalsender + unabhängige Lokalpresse ----------
  # 2026-11-25 ergänzt: Volltexte frei lesbar (keine Paywall), Ost-Schwerpunkt.
  # URLs ungeprüft eingetragen — collect.py warnt bei 0 Einträgen/HTTP-Fehler,
  # dann im Lauf-Log nachsehen und URL korrigieren.
  mdr_sachsen:
    type: nativ
    name: "MDR"
    url: https://www.mdr.de/nachrichten/sachsen/index-rss.xml
    region: sachsen
    ressort: lokal
  mdr_sachsen_anhalt:
    type: nativ
    name: "MDR"
    url: https://www.mdr.de/nachrichten/sachsen-anhalt/index-rss.xml
    region: sachsen-anhalt
    ressort: lokal
  mdr_thueringen:
    type: nativ
    name: "MDR"
    url: https://www.mdr.de/nachrichten/thueringen/index-rss.xml
    region: thueringen
    ressort: lokal
  rbb24:
    type: nativ
    name: "rbb24"
    url: https://www.rbb24.de/aktuell/index.xml/feed=rss.xml
    region: brandenburg
    ressort: lokal
  ndr_mv:
    type: nativ
    name: "NDR"
    url: https://www.ndr.de/nachrichten/mecklenburg-vorpommern/index-rss.xml
    region: mecklenburg-vorpommern
    ressort: lokal
  l_iz:
    type: nativ
    name: "Leipziger Internet Zeitung"
    url: https://www.l-iz.de/feed
    region: sachsen
    ressort: lokal


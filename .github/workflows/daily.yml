name: Knall Daily Pipeline

on:
  schedule:
    - cron: '0 5 * * *'   # 05:00 UTC = 06:00 MEZ
  workflow_dispatch:

permissions: {}   # Rechte pro Job, so knapp wie möglich

concurrency:
  group: knall-daily
  cancel-in-progress: false

jobs:
  pipeline:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # nur zum Committen der Pipeline-Ausgabe
    timeout-minutes: 60   # Free-Tier-Backoffs brauchen Puffer
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install deps
        run: pip install pyyaml feedparser requests

      - name: Collect feeds
        run: python scripts/collect.py

      - name: Deterministic scoring
        run: python scripts/score.py

      - name: KI0 curate
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          KI_MODEL_SMALL: ${{ vars.KI_MODEL_SMALL }}
        run: python scripts/ki_client.py curate

      - name: KI1 write + regex gate
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          KI_MODEL_LARGE: ${{ vars.KI_MODEL_LARGE }}
        run: python scripts/router.py write_stage

      - name: KI2 pruefen + Routing (Loop)
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          KI_MODEL_LARGE: ${{ vars.KI_MODEL_LARGE }}
        run: python scripts/router.py evaluate_stage

      - name: KI3 legal
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          KI_MODEL_LARGE: ${{ vars.KI_MODEL_LARGE }}
        run: python scripts/router.py legal_stage

      - name: Publish
        run: python scripts/publish.py

      - name: Update stats
        run: python scripts/stats.py

      - name: Build site
        run: python scripts/build_site.py

      - name: Commit pipeline output
        run: |
          git config user.name "knall-bot"
          git config user.email "bot@knall.local"
          git add -A sources published rejected stats.json site
          git diff --cached --quiet && { echo "nichts zu committen"; exit 0; }
          git commit -m "pipeline: $(date -u +%F)"
          # main kann sich während des langen Laufs bewegt haben → rebase + retry
          for i in 1 2 3 4; do
            git pull --rebase origin "${GITHUB_REF_NAME}" && git push origin "HEAD:${GITHUB_REF_NAME}" && exit 0
            echo "Push-Versuch $i fehlgeschlagen, neuer Versuch in $((i*10))s ..."
            git rebase --abort 2>/dev/null || true
            sleep $((i*10))
          done
          echo "::error::Push nach 4 Versuchen fehlgeschlagen"
          exit 1

  pages:
    needs: pipeline
    if: always() && needs.pipeline.result == 'success'
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}   # neuester Stand inkl. Pipeline-Commit, nicht github.sha
      - name: Build site
        run: |
          mkdir -p _site
          cp -r site/* _site/
          cp -r published _site/artikel
          cp stats.json _site/stats.json
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4

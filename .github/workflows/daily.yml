name: Knall Daily Pipeline

on:
  schedule:
    - cron: '0 2,7,13,19 * * *'   # 4x täglich: 03/08/14/20 Uhr MEZ
  workflow_dispatch:

permissions: {}   # Rechte pro Job, so knapp wie möglich

concurrency:
  group: knall-daily
  cancel-in-progress: false

jobs:
  pipeline:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # nur zum Committen der Pipeline-Ausgabe
    timeout-minutes: 60   # Free-Tier-Backoffs brauchen Puffer
    env:
      # Eigener LLM-Tageszähler (Default 50 = OpenRouter-Free-Kontingent)
      KNALL_TAGESLIMIT_ANFRAGEN: ${{ vars.KNALL_TAGESLIMIT_ANFRAGEN }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      # Vorarbeit des Tages (Teaser, Volltexte, Entwürfe, Tageszähler) liegt
      # VERSCHLÜSSELT im Actions-Cache: ein erneuter Lauf macht dort weiter, wo
      # der letzte abbrach. Verschlüsselt, weil Workflows aus Fork-PRs Caches
      # lesen können — der Schlüssel wird aus dem Secret OPENROUTER_API_KEY
      # abgeleitet, das Fork-PRs nie bekommen. (Neuer API-Key → alter Cache
      # nicht mehr lesbar → nur der Fortsetzungsstand des Tages geht verloren.)
      # EIN Datum für den ganzen Lauf (auch wenn er über Mitternacht UTC läuft)
      - name: Tag bestimmen
        id: day
        run: |
          DAY=$(date -u +%F)
          echo "day=$DAY" >> "$GITHUB_OUTPUT"
          echo "yesterday=$(date -u -d "$DAY - 1 day" +%F)" >> "$GITHUB_OUTPUT"
          echo "KNALL_DAY=$DAY" >> "$GITHUB_ENV"

      - name: Vorarbeit wiederherstellen
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: .knall-cache/work.tar.enc
          key: knall-work-enc-${{ steps.day.outputs.day }}-${{ github.run_id }}-${{ github.run_attempt }}
          # neuester Stand von heute; sonst der von gestern (offene Entwürfe fertig machen)
          restore-keys: |
            knall-work-enc-${{ steps.day.outputs.day }}-
            knall-work-enc-${{ steps.day.outputs.yesterday }}-

      - name: Vorarbeit entschluesseln
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: |
          F=.knall-cache/work.tar.enc
          [ -s "$F" ] || { echo "Kein Cache-Stand — frischer Start"; exit 0; }
          [ -n "$OPENROUTER_API_KEY" ] || { echo "::warning::Kein Schluessel — Cache ignoriert"; exit 0; }
          KNALL_CACHE_PASS=$(printf '%s' "$OPENROUTER_API_KEY" | sha256sum | cut -d' ' -f1)
          echo "::add-mask::$KNALL_CACHE_PASS"
          export KNALL_CACHE_PASS
          if openssl enc -d -aes-256-cbc -pbkdf2 -iter 200000 -pass env:KNALL_CACHE_PASS -in "$F" | tar -xz; then
            echo "Vorarbeit wiederhergestellt"
          else
            echo "::warning::Cache nicht entschluesselbar (API-Key gewechselt?) — frischer Start"
            rm -rf archiv
            find sources drafts -mindepth 1 ! -name .gitkeep -delete
          fi

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'

      - name: Install deps
        run: pip install -r requirements.txt

      # Fail-closed: sind die maschinellen Prüfungen kaputt, wird nichts geschrieben
      - name: Pruefungen testen
        run: python -m pytest -q tests

      - name: Aelteres als gestern aufraeumen (offene Reste → "abgelaufen")
        run: python scripts/common.py prune

      - name: Collect feeds
        run: python scripts/collect.py

      - name: Deterministic scoring (Teaser)
        run: python scripts/score.py

      # Originalartikel: Original-URL (auch hinter Google-News-Links) + Volltext
      - name: Volltext der Originalartikel holen
        run: python scripts/fulltext.py

      - name: Deterministic scoring (Volltext)
        run: python scripts/score.py

      - name: KI0 curate
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          KI_MODEL_SMALL: ${{ vars.KI_MODEL_SMALL }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: python scripts/ki_client.py curate

      - name: KI1 write + regex gate
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          KI_MODEL_LARGE: ${{ vars.KI_MODEL_LARGE }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: python scripts/router.py write_stage

      - name: KI2 pruefen + Routing (Loop)
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          KI_MODEL_LARGE: ${{ vars.KI_MODEL_LARGE }}
          KI_MODEL_CHECK: ${{ vars.KI_MODEL_CHECK }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: python scripts/router.py evaluate_stage

      - name: KI3 legal
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          KI_MODEL_LARGE: ${{ vars.KI_MODEL_LARGE }}
          KI_MODEL_CHECK: ${{ vars.KI_MODEL_CHECK }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: python scripts/router.py legal_stage

      - name: Publish
        if: always()
        run: python scripts/publish.py

      - name: Update stats
        if: always()
        run: python scripts/stats.py

      - name: Build site
        if: always()
        env:
          # Öffentliche Adresse für Vorschaukarten, Feed und Sitemap.
          # Eigene Domain später: Repo-Variable KNALL_URL setzen.
          KNALL_URL: ${{ vars.KNALL_URL || format('https://{0}.github.io/{1}/', github.repository_owner, github.event.repository.name) }}
        run: python scripts/build_site.py

      - name: Commit pipeline output
        if: always()
        run: |
          git config user.name "knall-bot"
          git config user.email "bot@knall.local"
          git add -A published rejected stats.json site
          git diff --cached --quiet && { echo "nichts zu committen"; exit 0; }
          git commit -m "pipeline: $(date -u +%F)"
          # main kann sich während des langen Laufs bewegt haben → rebase + retry
          for i in 1 2 3 4; do
            git pull --rebase origin "${GITHUB_REF_NAME}" && git push origin "HEAD:${GITHUB_REF_NAME}" && exit 0
            echo "Push-Versuch $i fehlgeschlagen, neuer Versuch in $((i*10))s ..."
            git rebase --abort 2>/dev/null || true
            sleep $((i*10))
          done
          echo "::error::Push nach 4 Versuchen fehlgeschlagen"
          exit 1

      - name: Vorarbeit verschluesseln (auch nach Abbruch)
        if: always()
        id: enc
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: |
          [ -n "$OPENROUTER_API_KEY" ] || { echo "::warning::Kein Schluessel — Vorarbeit wird nicht gesichert"; exit 0; }
          KNALL_CACHE_PASS=$(printf '%s' "$OPENROUTER_API_KEY" | sha256sum | cut -d' ' -f1)
          echo "::add-mask::$KNALL_CACHE_PASS"
          export KNALL_CACHE_PASS
          mkdir -p .knall-cache archiv/abgelehnt
          # archiv/ = privates Fehler-Archiv (abgelehnte Artikel vollständig, 90 Tage)
          tar -cz sources drafts archiv | openssl enc -aes-256-cbc -pbkdf2 -iter 200000 -salt \
            -pass env:KNALL_CACHE_PASS -out .knall-cache/work.tar.enc
          echo "ok=true" >> "$GITHUB_OUTPUT"

      - name: Vorarbeit sichern
        if: always() && steps.enc.outputs.ok == 'true'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: .knall-cache/work.tar.enc
          key: knall-work-enc-${{ steps.day.outputs.day }}-${{ github.run_id }}-${{ github.run_attempt }}

  pages:
    needs: pipeline
    if: always() && needs.pipeline.result == 'success'
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url || steps.deployment2.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: ${{ github.ref_name }}   # neuester Stand inkl. Pipeline-Commit, nicht github.sha
      - name: Build site
        run: |
          mkdir -p _site
          cp -r site/* _site/
          cp -r published _site/artikel
          cp stats.json _site/stats.json
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5.0.0
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3.0.1
        with:
          path: _site
      # GitHub meldet gelegentlich "Deployment failed, try again later" —
      # dann nach 30 s ein zweiter Versuch statt eines roten Laufs.
      - id: deployment
        continue-on-error: true
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
      - name: Kurz warten vor zweitem Deploy-Versuch
        if: steps.deployment.outcome == 'failure'
        run: sleep 30
      - id: deployment2
        if: steps.deployment.outcome == 'failure'
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
      # Neue Artikel als Fediverse-Posts zustellen (erst nach dem Deploy, damit
      # die Links schon funktionieren). Ohne Secrets wird übersprungen.
      - name: Fediverse
        if: steps.deployment.outcome == 'success' || steps.deployment2.outcome == 'success'
        continue-on-error: true
        env:
          FEDI_ENDPOINT: ${{ secrets.FEDI_ENDPOINT }}
          FEDI_TOKEN: ${{ secrets.FEDI_TOKEN }}
          FEDI_PRIVATE_KEY: ${{ secrets.FEDI_PRIVATE_KEY }}
          KNALL_URL: ${{ vars.KNALL_URL || format('https://{0}.github.io/{1}/', github.repository_owner, github.event.repository.name) }}
        run: |
          python3 -m pip install -q --user requests==2.32.3
          python3 scripts/fediverse.py
